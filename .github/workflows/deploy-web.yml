name: Deploy web to production

# Runs on every push to the app branch, and can be triggered manually from the
# GitHub website / mobile app (Actions → Deploy web → Run workflow).
on:
  push:
    branches:
      - claude/injazati-full-app-tzdu5l
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Export web bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web && node scripts/inject-pwa.js

      - name: Deploy to EAS Hosting (production)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli deploy --prod --non-interactive

      - name: Deploy to Cloudflare Pages (enjazaty.net)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: enjazaty-app-1
          directory: dist
